<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 封面圖快速抓取工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            min-height: 100vh;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .thumbnail-container img {
            transition: transform 0.3s ease;
        }
        .thumbnail-container:hover img {
            transform: scale(1.02);
        }
    </style>
</head>
<body class="py-10 px-4">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-bold text-gray-800 mb-4">
                <i class="fab fa-youtube text-red-600 mr-2"></i>YouTube 封面抓取器
            </h1>
            <p class="text-gray-600">輸入影片網址（支援 Shorts 與各種參數格式），自動取得封面</p>
        </div>

        <!-- Input Section -->
        <div class="glass-card rounded-2xl p-6 shadow-xl mb-8">
            <div class="flex flex-col md:flex-row gap-4">
                <input type="text" id="videoUrl" 
                    placeholder="請貼上 YouTube 影片網址" 
                    class="flex-1 px-4 py-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-red-500 focus:outline-none transition-all">
                <div class="flex gap-2">
                    <button onclick="getThumbnails()" 
                        class="bg-red-600 hover:bg-red-700 text-white px-8 py-3 rounded-xl font-medium transition-colors shadow-lg flex items-center justify-center">
                        <i class="fas fa-search mr-2"></i> 立即抓取
                    </button>
                    <button onclick="clearInput()" 
                        class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-3 rounded-xl font-medium transition-colors">
                        <i class="fas fa-redo"></i>
                    </button>
                </div>
            </div>
            <p id="errorMessage" class="text-red-500 mt-3 text-sm hidden">請輸入有效的 YouTube 網址（例如帶有 v=ID 或 youtu.be/ID）</p>
        </div>

        <!-- Results Section -->
        <div id="results" class="hidden space-y-8">
            
            <!-- Main Preview (Max Res) -->
            <div id="maxResSection" class="glass-card rounded-2xl p-6 shadow-lg overflow-hidden">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-bold text-gray-800">最高畫質 (Maximum Resolution)</h2>
                    <span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded">推薦</span>
                </div>
                <div class="thumbnail-container rounded-xl overflow-hidden bg-gray-200 aspect-video relative group">
                    <img id="maxResImg" src="" alt="Max Res Thumbnail" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center gap-4">
                        <a id="maxResLink" href="#" target="_blank" class="bg-white text-gray-800 px-4 py-2 rounded-lg font-medium hover:bg-gray-100">
                            查看原圖
                        </a>
                    </div>
                </div>
                <div class="mt-4 flex justify-between items-center">
                    <p id="maxResHint" class="text-sm text-gray-500">解析度: 1280 x 720 (若影片支援)</p>
                    <button onclick="copyToClipboard('maxResImg')" class="text-blue-600 hover:text-blue-800 text-sm font-medium">
                        <i class="far fa-copy mr-1"></i> 複製圖片網址
                    </button>
                </div>
            </div>

            <!-- Grid for other sizes -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Standard Quality -->
                <div class="glass-card rounded-2xl p-5 shadow-md">
                    <h3 class="font-bold text-gray-700 mb-3">標準畫質 (Standard)</h3>
                    <img id="sdImg" class="w-full rounded-lg mb-3 border" src="">
                    <a id="sdLink" href="#" target="_blank" class="text-sm text-red-600 hover:underline">下載 640 x 480</a>
                </div>

                <!-- High Quality -->
                <div class="glass-card rounded-2xl p-5 shadow-md">
                    <h3 class="font-bold text-gray-700 mb-3">高畫質 (HQ)</h3>
                    <img id="hqImg" class="w-full rounded-lg mb-3 border" src="">
                    <a id="hqLink" href="#" target="_blank" class="text-sm text-red-600 hover:underline">下載 480 x 360</a>
                </div>

                <!-- Medium Quality -->
                <div class="glass-card rounded-2xl p-5 shadow-md">
                    <h3 class="font-bold text-gray-700 mb-3">中畫質 (MQ)</h3>
                    <img id="mqImg" class="w-full rounded-lg mb-3 border" src="">
                    <a id="mqLink" href="#" target="_blank" class="text-sm text-red-600 hover:underline">下載 320 x 180</a>
                </div>

                <!-- Default Thumbnail -->
                <div class="glass-card rounded-2xl p-5 shadow-md">
                    <h3 class="font-bold text-gray-700 mb-3">預覽縮圖 (Default)</h3>
                    <img id="defImg" class="w-full rounded-lg mb-3 border max-w-[120px]" src="">
                    <a id="defLink" href="#" target="_blank" class="text-sm text-red-600 hover:underline">下載 120 x 90</a>
                </div>
            </div>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="text-center py-20 bg-white/50 rounded-2xl border-2 border-dashed border-gray-300">
            <i class="fas fa-image text-gray-400 text-5xl mb-4"></i>
            <p class="text-gray-500">輸入網址後，封面圖片將會在此顯示</p>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-2xl transition-all opacity-0 pointer-events-none z-50">
        已複製圖片網址！
    </div>

    <script>
        /**
         * 強化的影片 ID 提取邏輯
         * 支援: youtube.com/watch?v=ID, youtu.be/ID, youtube.com/shorts/ID, youtube.com/embed/ID
         */
        function extractVideoId(url) {
            if (!url) return false;
            url = url.trim();
            
            try {
                const urlObj = new URL(url);
                
                // 處理 youtu.be 短網址
                if (urlObj.hostname === 'youtu.be') {
                    return urlObj.pathname.substring(1).split(/[?#]/)[0];
                }
                
                // 處理 youtube.com 網址
                if (urlObj.hostname.includes('youtube.com')) {
                    // 1. 標準網址包含 v= 參數 (不管參數位置)
                    if (urlObj.searchParams.has('v')) {
                        return urlObj.searchParams.get('v');
                    }
                    
                    // 2. 處理路徑形式 (shorts, embed, v)
                    const pathSegments = urlObj.pathname.split('/');
                    const typeIndex = pathSegments.findIndex(s => ['shorts', 'embed', 'v'].includes(s));
                    if (typeIndex !== -1 && pathSegments[typeIndex + 1]) {
                        return pathSegments[typeIndex + 1];
                    }
                }
            } catch (e) {
                // 如果 URL 構造失敗，嘗試用正則做最後補救
                const match = url.match(/(?:v=|\/)([0-9A-Za-z_-]{11}).*/);
                if (match) return match[1];
            }
            return false;
        }

        function getThumbnails() {
            const urlInput = document.getElementById('videoUrl').value;
            const videoId = extractVideoId(urlInput);
            const errorMsg = document.getElementById('errorMessage');
            const results = document.getElementById('results');
            const emptyState = document.getElementById('emptyState');
            const maxResHint = document.getElementById('maxResHint');

            if (!videoId) {
                errorMsg.classList.remove('hidden');
                results.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            errorMsg.classList.add('hidden');
            emptyState.classList.add('hidden');
            results.classList.remove('hidden');
            maxResHint.innerText = "解析度: 1280 x 720 (若影片支援)";

            const images = {
                maxRes: `https://img.youtube.com/vi/${videoId}/maxresdefault.jpg`,
                sd: `https://img.youtube.com/vi/${videoId}/sddefault.jpg`,
                hq: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`,
                mq: `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`,
                def: `https://img.youtube.com/vi/${videoId}/default.jpg`
            };

            // 更新預覽圖與連結
            document.getElementById('maxResImg').src = images.maxRes;
            document.getElementById('maxResLink').href = images.maxRes;
            
            document.getElementById('sdImg').src = images.sd;
            document.getElementById('sdLink').href = images.sd;
            
            document.getElementById('hqImg').src = images.hq;
            document.getElementById('hqLink').href = images.hq;
            
            document.getElementById('mqImg').src = images.mq;
            document.getElementById('mqLink').href = images.mq;
            
            document.getElementById('defImg').src = images.def;
            document.getElementById('defLink').href = images.def;

            results.scrollIntoView({ behavior: 'smooth', block: 'start' });
            
            // 處理 MaxRes 可能不存在的情況 (回傳 404 時)
            const maxResImg = document.getElementById('maxResImg');
            maxResImg.onerror = function() {
                this.src = images.hq; // 降級顯示
                maxResHint.innerText = "提示: 該影片不支援 1280x720 封面，已顯示 HQ 版本";
            };
        }

        function clearInput() {
            document.getElementById('videoUrl').value = '';
            document.getElementById('results').classList.add('hidden');
            document.getElementById('emptyState').classList.remove('hidden');
            document.getElementById('errorMessage').classList.add('hidden');
        }

        function copyToClipboard(imgId) {
            const imgSrc = document.getElementById(imgId).src;
            const dummy = document.createElement("input");
            document.body.appendChild(dummy);
            dummy.value = imgSrc;
            dummy.select();
            document.execCommand("copy");
            document.body.removeChild(dummy);

            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2000);
        }

        document.getElementById('videoUrl').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                getThumbnails();
            }
        });
    </script>
</body>
</html>
